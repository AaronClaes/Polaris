<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Polaris</title>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP
         script-src 'wasm-unsafe-eval': the 3D model viewer's Draco/meshopt decoders
         are WebAssembly. The Optimize/Export pipeline (gltf-transform + its
         ndarray-ops `new Function()` eval) now runs in the main process, so the
         renderer no longer needs full 'unsafe-eval'. script-src stays 'self' (no
         inline/remote scripts), app is local-only. blob: (img/connect) + worker-src
         blob:: models load from in-memory blob URLs and Draco spins up a
         blob-sourced worker. All local — no remote origins added. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://avatars.githubusercontent.com; connect-src 'self' blob: data:; worker-src 'self' blob:"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
