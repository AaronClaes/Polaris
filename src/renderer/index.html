<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Polaris</title>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP
         script-src wasm-unsafe-eval: the 3D model viewer's Draco/meshopt decoders
         are WebAssembly. blob: (img/connect) + worker-src blob:: models load from
         in-memory blob URLs and Draco spins up a blob-sourced worker. All still
         local — no remote origins added. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://avatars.githubusercontent.com; connect-src 'self' blob: data:; worker-src 'self' blob:"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
